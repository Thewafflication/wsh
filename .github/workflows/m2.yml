name: WSH Windows CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64 Debug
            preset: x64-debug
            configuration: Debug
            build_directory: out/build/x64-debug
            artifact_name: wsh-x64-debug
          - name: x64 Release
            preset: x64-release
            configuration: Release
            build_directory: out/build/x64-release
            artifact_name: wsh-x64-release
          - name: x86 Debug
            preset: x86-debug
            configuration: Debug
            build_directory: out/build/x86-debug
            artifact_name: wsh-x86-debug
    steps:
      - name: Check out source and WSP
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install current Doxygen release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
              Accept = 'application/vnd.github+json'
              'User-Agent' = 'wsh-windows-ci'
          }
          if ($env:GH_TOKEN) {
              $headers.Authorization = "Bearer $env:GH_TOKEN"
          }
          $releaseUri =
              'https://api.github.com/repos/doxygen/doxygen/releases/latest'
          $release = Invoke-RestMethod -Headers $headers -Uri $releaseUri
          $pattern = '^doxygen-(?<version>\d+\.\d+\.\d+)' +
              '\.windows\.x64\.bin\.zip$'
          $assets = @($release.assets | Where-Object {
              $_.name -match $pattern
          })
          if ($assets.Count -ne 1) {
              throw "Expected one Windows x64 Doxygen asset; found " +
                  $assets.Count
          }
          $asset = $assets[0]
          $assetMatch = [regex]::Match($asset.name, $pattern)
          $selectedVersion =
              [version]$assetMatch.Groups['version'].Value
          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          $destination = Join-Path $env:GITHUB_WORKSPACE `
              'out/tools/doxygen/bin'
          Write-Host "Downloading Doxygen $selectedVersion"
          Invoke-WebRequest -UseBasicParsing `
              -Uri $asset.browser_download_url `
              -OutFile $archive
          New-Item -ItemType Directory -Force -Path $destination |
              Out-Null
          Expand-Archive -LiteralPath $archive `
              -DestinationPath $destination
          $doxygen = Join-Path $destination 'doxygen.exe'
          $reportedOutput = (& $doxygen --version).Trim()
          Write-Host "Doxygen version: $reportedOutput"
          $reportedMatch = [regex]::Match(
              $reportedOutput,
              '^\d+\.\d+\.\d+')
          if (-not $reportedMatch.Success) {
              throw "Unrecognized Doxygen version: $reportedOutput"
          }
          $reportedVersion = [version]$reportedMatch.Value
          if ($reportedVersion -ne $selectedVersion) {
              throw "Doxygen version mismatch: $reportedOutput"
          }

      - name: Configure
        shell: pwsh
        run: cmake --preset '${{ matrix.preset }}'

      - name: Build
        shell: pwsh
        run: cmake --build --preset '${{ matrix.preset }}'

      - name: Run CTest
        shell: pwsh
        run: ctest --preset '${{ matrix.preset }}'

      - name: Upload controlled evidence and test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.build_directory }}/test-evidence/${{ matrix.configuration }}
            ${{ matrix.build_directory }}/test-evidence/m3/${{ matrix.configuration }}
            ${{ matrix.build_directory }}/Testing/Temporary/LastTest.log
            ${{ matrix.build_directory }}/Testing/Temporary/LastTestsFailed.log
            ${{ matrix.build_directory }}/${{ matrix.configuration }}/wsh.exe
            ${{ matrix.build_directory }}/${{ matrix.configuration }}/wsh.pdb
            ${{ matrix.build_directory }}/${{ matrix.configuration }}/wshlib.dll
            ${{ matrix.build_directory }}/${{ matrix.configuration }}/wshlib.pdb
            ${{ matrix.build_directory }}/tests/${{ matrix.configuration }}/*-tests.exe
            ${{ matrix.build_directory }}/tests/${{ matrix.configuration }}/*-tests.pdb
            out/doxygen/m2
            out/doxygen/m3
          if-no-files-found: warn
          retention-days: 14
